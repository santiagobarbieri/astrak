<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20fill%3D%27white%27/%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2714%27%20fill%3D%27black%27%20opacity%3D%270.9%27/%3E%3C/svg%3E" />
  <title>THE HERALD</title>
  <link rel="stylesheet" href="garet.css" />

  <!-- Dependencias -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --herald-black: #ffffff;
      --herald-white: #000000;
      --herald-accent: #e2ff00;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: #fff; }
    body {
      margin: 0;
      overflow-x: hidden;
      background-color: var(--herald-black);
      color: var(--herald-white);
      font-family: 'Garet', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Animaciones Atmosféricas */
    @keyframes rain-fall { 0% { transform: translateY(-120vh) rotate(15deg); } 100% { transform: translateY(120vh) rotate(15deg); } }
    @keyframes lightning-bolt { 
      0%, 94%, 100% { opacity: 0; } 
      95% { opacity: 1; background: #ffffff; }
      96% { opacity: 0.3; } 
      97% { opacity: 0.9; background: #f0f9ff; }
    }
    @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
    @keyframes celestial-float { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(-6px, 5px, 0) scale(1.025); } }
    @keyframes cloud-drift { 0% { transform: translate3d(-4%, 0, 0); } 100% { transform: translate3d(4%, 0, 0); } }

    .rain-drop {
      position: absolute;
      z-index: 13;
      width: var(--rain-width);
      height: var(--rain-length);
      background: linear-gradient(transparent, var(--rain-color));
      box-shadow: 0 0 12px var(--rain-glow);
      animation: rain-fall var(--rain-speed) linear infinite;
      pointer-events: none;
    }
    .lightning-effect { position: absolute; inset: 0; z-index: 5; pointer-events: none; animation: lightning-bolt 10s ease-in-out infinite; }
    .analog-noise { position: absolute; inset: 0; z-index: 20; pointer-events: none; opacity: 0.055; mix-blend-mode: screen; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
    .scanline { position: absolute; top: 0; left: 0; width: 100%; height: 120px; background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.03), transparent); animation: scanline 10s linear infinite; z-index: 21; pointer-events: none; }

    .atmosphere-base {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 18%, var(--sky-glow), transparent 22%),
        radial-gradient(ellipse at 82% 16%, var(--weather-rim), transparent 34%),
        radial-gradient(ellipse at 50% 92%, var(--horizon-glow), transparent 42%),
        linear-gradient(160deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bottom) 100%);
    }

    .atmosphere-base::before,
    .atmosphere-base::after {
      content: "";
      position: absolute;
      inset: -18%;
      pointer-events: none;
    }

    .atmosphere-base::before {
      z-index: 1;
      opacity: 0.72;
      mix-blend-mode: screen;
      background:
        linear-gradient(115deg, rgba(255,255,255,0.12), transparent 28%),
        radial-gradient(ellipse at 78% 34%, var(--cloud-glow), transparent 32%),
        radial-gradient(ellipse at 24% 78%, var(--storm-glow), transparent 38%);
    }

    .atmosphere-base.cloudy::before,
    .atmosphere-base.storm::before,
    .atmosphere-base.electric::before {
      opacity: 0.92;
    }

    .atmosphere-base::after {
      z-index: 2;
      opacity: 0.68;
      background:
        linear-gradient(90deg, var(--horizon-sheen), transparent 28%, rgba(255,255,255,0.05) 72%, transparent),
        radial-gradient(circle at 50% 55%, var(--air-haze), transparent 44%);
    }

    .star-field {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: var(--star-opacity);
      background-image:
        radial-gradient(circle at 12% 20%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 28% 12%, rgba(255,255,255,0.5) 0 1px, transparent 1.5px),
        radial-gradient(circle at 44% 24%, rgba(255,255,255,0.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 68% 16%, rgba(255,255,255,0.56) 0 1px, transparent 1.5px),
        radial-gradient(circle at 82% 32%, rgba(255,255,255,0.74) 0 1px, transparent 1.5px),
        radial-gradient(circle at 18% 46%, rgba(255,255,255,0.48) 0 1px, transparent 1.5px),
        radial-gradient(circle at 58% 42%, rgba(255,255,255,0.52) 0 1px, transparent 1.5px),
        radial-gradient(circle at 90% 58%, rgba(255,255,255,0.44) 0 1px, transparent 1.5px);
    }

    .cloud-layer {
      position: absolute;
      inset: -10% -12%;
      z-index: 3;
      pointer-events: none;
      opacity: var(--cloud-opacity);
      filter: blur(18px);
      mix-blend-mode: screen;
      animation: cloud-drift 26s ease-in-out infinite alternate;
      background:
        radial-gradient(ellipse at 18% 30%, var(--cloud-core), transparent 28%),
        radial-gradient(ellipse at 42% 22%, var(--cloud-core), transparent 24%),
        radial-gradient(ellipse at 72% 34%, var(--cloud-core), transparent 30%),
        radial-gradient(ellipse at 88% 12%, var(--cloud-edge), transparent 26%),
        linear-gradient(180deg, transparent 0%, var(--cloud-shadow) 72%, transparent 100%);
    }

    .rain-curtain {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      opacity: var(--rain-curtain-opacity);
      mix-blend-mode: screen;
      background:
        repeating-linear-gradient(104deg, transparent 0 18px, var(--rain-curtain-color) 19px 20px, transparent 21px 42px);
      filter: blur(0.4px);
    }

    .cloud-layer.back {
      z-index: 1;
      opacity: var(--cloud-back-opacity);
      filter: blur(32px);
      animation-duration: 38s;
      background:
        radial-gradient(ellipse at 26% 18%, var(--cloud-edge), transparent 30%),
        radial-gradient(ellipse at 66% 26%, var(--cloud-core), transparent 36%),
        radial-gradient(ellipse at 52% 70%, var(--cloud-shadow), transparent 34%);
    }

    .celestial-body {
      position: absolute;
      top: var(--celestial-top);
      left: var(--celestial-left);
      z-index: 4;
      width: clamp(3rem, 6.5vw, 5.5rem);
      height: clamp(3rem, 6.5vw, 5.5rem);
      border-radius: 999px;
      pointer-events: none;
      animation: celestial-float 11s ease-in-out infinite;
      opacity: var(--celestial-opacity);
    }

    .celestial-body.sun {
      background:
        radial-gradient(circle at 36% 32%, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.28) 12%, transparent 26%),
        radial-gradient(circle, rgba(255,231,128,0.78) 0%, rgba(255,122,77,0.42) 42%, rgba(255,122,77,0) 72%);
      box-shadow:
        0 0 36px rgba(255, 214, 102, 0),
        0 0 110px rgba(255,122,77,0.16);
      mix-blend-mode: screen;
    }

    .celestial-body.moon {
      background:
        radial-gradient(circle at 38% 34%, rgba(255,255,255,0.88) 0%, rgba(226,232,240,0.68) 42%, rgba(148,163,184,0.12) 72%);
      box-shadow:
        0 0 28px rgba(255,255,255,0.18),
        0 0 90px rgba(120,160,255,0.12);
      mix-blend-mode: screen;
    }

    .celestial-body.moon::after {
      content: "";
      position: absolute;
      top: -8%;
      left: 28%;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: var(--sky-top);
      box-shadow: -8px 6px 24px rgba(0,0,0,0.12);
    }

    .weather-halo {
      position: absolute;
      inset: 5% 8% auto auto;
      z-index: 3;
      width: min(58vw, 720px);
      height: min(58vw, 720px);
      border-radius: 999px;
      pointer-events: none;
      mix-blend-mode: screen;
      background:
        radial-gradient(circle, var(--weather-halo-core) 0%, var(--weather-halo-edge) 36%, transparent 70%);
    }

    .atmosphere-day-wash {
      position: absolute;
      inset: 0;
      z-index: 14;
      pointer-events: none;
      background:
        linear-gradient(115deg, var(--day-wash) 0%, transparent 36%),
        radial-gradient(ellipse at 28% 18%, var(--air-haze), transparent 32%);
    }

    .hero-depth-gradient { 
      position: absolute;
      inset: 0;
      z-index: 15;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.02) 0%, transparent 28%, rgba(0,0,0,0.34) 62%, rgba(0,0,0,0.42) 78%, rgba(255,255,255,0.1) 91%),
        radial-gradient(ellipse at 18% 74%, rgba(0,0,0,0.46), transparent 38%),
        radial-gradient(ellipse at 20% 88%, rgba(0, 0, 0, 0.16), transparent 46%);
    }

    .news-transition {
      position: relative;
      z-index: 40;
      margin-top: 0;
      min-height: 100vh;
      background: #fff;
    }

    .headline-content {
      text-shadow: 0 2px 24px rgba(0,0,0,0.48), 0 1px 2px rgba(0,0,0,0.22);
    }

    .headline-content::before {
      content: "";
      position: absolute;
      inset: -2rem -2.5rem -2.4rem;
      z-index: -1;
      pointer-events: none;
      border-radius: 48px;
      filter: blur(18px);
    }

    .herald-font-black { font-weight: 900; }
    .herald-leading-tightest { line-height: 1.05; }
  </style>
</head>
<body>
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#000;font-family:Arial,sans-serif;text-align:center;padding:24px;">
      <div>
        <div style="font-size:14px;font-weight:900;letter-spacing:0.08em;">THE HERALD</div>
        <div style="margin-top:12px;font-size:11px;font-weight:700;text-transform:uppercase;color:rgba(0,0,0,0.45);">Cargando interfaz...</div>
      </div>
    </div>
  </div>

  <script type="text/babel" data-presets="env" data-plugins="transform-react-jsx">
    /** @jsxRuntime classic */
    const dependencyStatus = {
      React: Boolean(window.React),
      ReactDOM: Boolean(window.ReactDOM)
    };
    const missingDependencies = Object.entries(dependencyStatus)
      .filter(([, isLoaded]) => !isLoaded)
      .map(([name]) => name);

    if (missingDependencies.length) {
      document.getElementById('root').innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#000;font-family:Arial,sans-serif;text-align:center;padding:24px;">
          <div style="max-width:420px;">
            <div style="font-size:14px;font-weight:900;letter-spacing:0.08em;">THE HERALD</div>
            <div style="margin-top:14px;font-size:12px;font-weight:700;line-height:1.7;color:rgba(0,0,0,0.62);">
              No se pudieron cargar dependencias externas: ${missingDependencies.join(', ')}.
              Abrí la página con conexión a internet o revisá bloqueadores de CDN.
            </div>
          </div>
        </div>
      `;
      throw new Error(`Missing dependencies: ${missingDependencies.join(', ')}`);
    }

    const { useState, useEffect, useMemo, useRef } = React;
    const createMotionFallback = () => {
      const motionProps = new Set([
        'animate',
        'exit',
        'initial',
        'layout',
        'layoutId',
        'transition',
        'viewport',
        'whileInView'
      ]);
      const renderTag = (tag) => ({ children, ...props }) => {
        const domProps = Object.fromEntries(
          Object.entries(props).filter(([key]) => !motionProps.has(key))
        );
        return React.createElement(tag, domProps, children);
      };

      return {
        motion: new Proxy({}, {
          get: (_, tag) => renderTag(tag)
        }),
        AnimatePresence: ({ children }) => <>{children}</>
      };
    };
    const MotionLib = window.FramerMotion || window.Motion || createMotionFallback();
    const { motion, AnimatePresence } = MotionLib;

    const BY_HERALD_STORAGE_KEY = 'the_herald_by_crusade_articles';
    const RSS_TO_JSON_API = 'https://api.rss2json.com/v1/api.json?rss_url=';
    const REQUEST_TIMEOUT_MS = 8000;
    const BUENOS_AIRES_TIMEZONE = 'America/Argentina/Buenos_Aires';
    const BUENOS_AIRES_COORDS = {
      latitude: -34.6037,
      longitude: -58.3816
    };
    const WEATHER_API_URL = `https://api.open-meteo.com/v1/forecast?latitude=${BUENOS_AIRES_COORDS.latitude}&longitude=${BUENOS_AIRES_COORDS.longitude}&current=temperature_2m,weather_code,is_day&timezone=${encodeURIComponent(BUENOS_AIRES_TIMEZONE)}`;

    const WEATHER_LABELS = {
      clear: 'Despejado',
      cloudy: 'Nublado',
      storm: 'Tormenta',
      electric: 'Tormenta eléctrica'
    };

    const PERIOD_LABELS = {
      dawn: 'Amanecer',
      day: 'Día',
      dusk: 'Atardecer',
      night: 'Noche'
    };

    const getBuenosAiresTimeParts = (date = new Date()) => {
      const formatter = new Intl.DateTimeFormat('en-CA', {
        timeZone: BUENOS_AIRES_TIMEZONE,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });

      return formatter.formatToParts(date).reduce((acc, part) => {
        if (part.type !== 'literal') acc[part.type] = Number(part.value);
        return acc;
      }, {});
    };

    const getPeriodFromHour = (hour) => {
      if (hour >= 5 && hour < 7.5) return 'dawn';
      if (hour >= 7.5 && hour < 17.25) return 'day';
      if (hour >= 17.25 && hour < 20) return 'dusk';
      return 'night';
    };

    const getCelestialPosition = (hour, isNight) => {
      const progress = isNight
        ? ((hour >= 20 ? hour - 20 : hour + 4) / 9)
        : ((hour - 5) / 15);
      const clampedProgress = Math.min(1, Math.max(0, progress));

      return {
        celestialLeft: `${12 + clampedProgress * 68}%`,
        celestialTop: `${18 + Math.sin(clampedProgress * Math.PI) * -11 + Math.abs(clampedProgress - 0.5) * 18}%`
      };
    };

    const mapWeatherCodeToCondition = (weatherCode) => {
      if ([95, 96, 99].includes(weatherCode)) return 'electric';
      if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(weatherCode)) return 'storm';
      if ([1, 2, 3, 45, 48, 71, 73, 75, 77, 85, 86].includes(weatherCode)) return 'cloudy';
      return 'clear';
    };

    const stripHtml = (value = '') => value.replace(/<[^>]*>?/gm, ' ').replace(/\s+/g, ' ').trim();
    const normalizeText = (value = '') => stripHtml(value).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '').trim();
    const escapeRegExp = (value = '') => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const fetchWithTimeout = (url, { signal, timeout = REQUEST_TIMEOUT_MS } = {}) => {
      const controller = new AbortController();
      const abort = () => controller.abort();
      const timeoutId = setTimeout(abort, timeout);

      if (signal) {
        if (signal.aborted) abort();
        signal.addEventListener('abort', abort, { once: true });
      }

      return fetch(url, { signal: controller.signal }).finally(() => {
        clearTimeout(timeoutId);
        if (signal) signal.removeEventListener('abort', abort);
      });
    };
    const removeTitleFromText = (text, title) => {
      const cleanText = stripHtml(text);
      const cleanTitle = stripHtml(title);
      if (!cleanText || !cleanTitle) return cleanText;

      const titlePattern = new RegExp(`^${escapeRegExp(cleanTitle)}[:\\s\\-.,;|]*`, 'i');
      return cleanText.replace(titlePattern, '').trim();
    };
    const getBestSummaryText = (item, title) => {
      const candidates = [
        item.description,
        item.content,
        item.contentSnippet,
        item.summary,
        item.full_content
      ];

      for (const candidate of candidates) {
        const cleaned = removeTitleFromText(candidate || '', title);
        const normalized = normalizeText(cleaned);
        if (cleaned && normalized && normalized !== normalizeText(title) && cleaned.length >= 24) {
          return cleaned;
        }
      }

      return '';
    };
    const buildExcerpt = (description, title) => {
      const cleanDescription = removeTitleFromText(description, title);
      if (!cleanDescription) return null;

      const normalizedTitle = normalizeText(title);
      const normalizedDescription = normalizeText(cleanDescription);

      if (!normalizedDescription || normalizedDescription === normalizedTitle) return null;
      if (normalizedDescription.startsWith(normalizedTitle) && normalizedDescription.length <= normalizedTitle.length + 24) return null;

      const summary = cleanDescription.slice(0, 180).trim();
      return summary.length >= 45 ? `${summary}${cleanDescription.length > 180 ? '...' : ''}` : null;
    };

    const CATEGORIES = [
      { id: 'ALL', name: 'Todas', color: '#e2ff00' },
      { id: 'POLITICS', name: 'Política', color: '#4dabff', query: 'https://news.google.com/rss/headlines/section/topic/POLITICS?hl=es-419&gl=AR&ceid=AR:es-419' },
      { id: 'TECH', name: 'Tecnología', color: '#c084fc', query: 'https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=es-419&gl=AR&ceid=AR:es-419' },
      {
        id: 'ENTERTAINMENT',
        name: 'Cine/Música',
        color: '#ff7a4d',
        queries: [
          'https://news.google.com/rss/search?q=peliculas%20internacionales%20OR%20Hollywood%20OR%20Oscars%20OR%20Cannes%20OR%20streaming&hl=es-419&gl=US&ceid=US:es-419',
          'https://news.google.com/rss/search?q=musica%20popular%20OR%20pop%20OR%20album%20OR%20tour%20OR%20Billboard&hl=es-419&gl=US&ceid=US:es-419'
        ]
      },
      { id: 'ECONOMY', name: 'Economía', color: '#34d399', query: 'https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=es-419&gl=AR&ceid=AR:es-419' },
      { id: 'WORLD', name: 'Internacional', color: '#fbbf24', query: 'https://news.google.com/rss/headlines/section/topic/WORLD?hl=es-419&gl=AR&ceid=AR:es-419' },
      { id: 'CULTURE', name: 'Cultura', color: '#f472b6', query: 'https://news.google.com/rss/search?q=cultura%20arte%20literatura%20Argentina&hl=es-419&gl=AR&ceid=AR:es-419' },
      { id: 'BY_HERALD', name: 'By The Herald', color: '#111111', internal: true },
      { id: 'ABOUT', name: 'About', color: '#111111', internal: true },
    ];

    const DEFAULT_BY_HERALD_ARTICLES = [
      {
        id: 'seed-signal-001',
        title: 'La señal no es el volumen',
        category: 'By The Herald',
        source: 'THE HERALD',
        color: '#111111',
        pubDate: new Date().toISOString(),
        timeAgo: 'Now',
        excerpt: 'Una lectura breve sobre cómo separar ruido, prioridad y presencia en un flujo de noticias constante.',
        quickRead: 'THE HERALD entiende la información como una señal: algo que debe ser filtrado, jerarquizado y puesto en escena. Es desarrollado por CRUSADE, una plataforma de curación de diseño pensada para organizar referencias, cultura visual y lectura editorial con más profundidad que un tablero tradicional.',
        url: ''
      }
    ];

    const getStoredByHeraldArticles = () => {
      try {
        const stored = JSON.parse(localStorage.getItem(BY_HERALD_STORAGE_KEY) || '[]');
        if (!Array.isArray(stored) || stored.length === 0) return DEFAULT_BY_HERALD_ARTICLES;

        return stored.map((item, index) => ({
          id: item.id || `herald-${index}`,
          title: item.title || 'Sin título',
          category: 'By The Herald',
          source: 'THE HERALD',
          color: '#111111',
          pubDate: item.pubDate || new Date().toISOString(),
          timeAgo: item.timeAgo || 'Now',
          excerpt: item.excerpt || '',
          quickRead: item.body || item.quickRead || item.excerpt || 'Sin texto disponible.',
          url: item.url || ''
        }));
      } catch (e) {
        console.error(e);
        return DEFAULT_BY_HERALD_ARTICLES;
      }
    };

    const HeraldLogo = ({ className }) => (
      <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="white"/>
        <circle cx="50" cy="50" r="22" stroke="black" strokeWidth="12"/>
        <circle cx="50" cy="50" r="6" fill="black"/>
      </svg>
    );

    const LoadingScreen = () => (
      <div className="fixed inset-0 z-[300] bg-white flex flex-col items-center justify-center">
        <HeraldLogo className="w-12 h-12 mb-8 animate-pulse" />
        <motion.span 
          animate={{ opacity: [0.3, 1, 0.3] }}
          transition={{ duration: 1.5, repeat: Infinity }}
          className="text-[10px] font-black uppercase"
        >
          Protocolo Inicial _
        </motion.span>
      </div>
    );

    const EmptyNewsState = ({ activeCat }) => (
      <section className="min-h-screen px-6 md:px-16 pt-36 pb-20 bg-white flex items-center justify-center text-center">
        <div className="max-w-md">
          <HeraldLogo className="w-12 h-12 mx-auto mb-8" />
          <div className="text-[10px] font-black uppercase text-black/35 mb-5">Sin transmision disponible</div>
          <h1 className="text-2xl md:text-3xl font-black uppercase leading-tight mb-6">
            No se pudieron cargar noticias de {activeCat.name}
          </h1>
          <p className="text-sm leading-7 text-neutral-600 mb-8">
            La interfaz cargo, pero las fuentes externas no devolvieron contenido. Puede ser un bloqueo de red, una cuota de rss2json o un fallo temporal del proveedor.
          </p>
          <button
            onClick={() => window.location.reload()}
            className="px-5 py-3 rounded-full bg-black text-white text-[10px] font-black uppercase hover:opacity-80 transition-opacity"
          >

    const getWeatherState = ({ date = new Date(), weatherCode = 0, isDay = null, temperature = null } = {}) => {
      const timeParts = getBuenosAiresTimeParts(date);
      const hour = (timeParts.hour || 0) + ((timeParts.minute || 0) / 60);
      const period = getPeriodFromHour(hour);
      const condition = mapWeatherCodeToCondition(weatherCode);
      const isNight = typeof isDay === 'number' ? isDay === 0 : period === 'night';
      const isStorm = condition === 'storm' || condition === 'electric';
      const intensity = condition === 'electric'
        ? 118
        : condition === 'storm'
          ? 92
          : 0;

      return {
        condition,
        period,
        intensity,
        isNight,
        isStorm,
        weatherCode,
        isDay,
        temperature,
        location: 'Buenos Aires, AR',
        ...getCelestialPosition(hour, isNight)
      };
    };

        '--celestial-left': weather.celestialLeft,

    function App() {
      const [news, setNews] = useState([]);
      const [headline, setHeadline] = useState(null);
      const [activeCat, setActiveCat] = useState(CATEGORIES[0]);
      const [selectedArticle, setSelectedArticle] = useState(null);
      const [loading, setLoading] = useState(true);
      const [byHeraldArticles, setByHeraldArticles] = useState(() => getStoredByHeraldArticles());
      const [weather, setWeather] = useState(() => getWeatherState());
      const [timeLabel, setTimeLabel] = useState(() => {
        const parts = getBuenosAiresTimeParts();
        return [parts.hour, parts.minute, parts.second].map(value => String(value || 0).padStart(2, '0')).join(':');
      });
      const requestSeq = useRef(0);

      useEffect(() => {
        const timer = setInterval(() => {
          const now = new Date();
          const parts = getBuenosAiresTimeParts(now);
          setTimeLabel([parts.hour, parts.minute, parts.second].map(value => String(value || 0).padStart(2, '0')).join(':'));
          setWeather(prev => ({
            ...prev,
            ...getWeatherState({
              date: now,
              weatherCode: prev.weatherCode || 0,
              isDay: typeof prev.isDay === 'number' ? prev.isDay : null,
              temperature: prev.temperature ?? null
            })
          }));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        const controller = new AbortController();

        const loadWeather = async () => {
          try {
            const res = await fetchWithTimeout(WEATHER_API_URL, { signal: controller.signal });
            if (!res.ok) throw new Error(`weather status ${res.status}`);
            const data = await res.json();
            const current = data.current || {};

            setWeather(getWeatherState({
              date: new Date(),
              weatherCode: Number.isFinite(current.weather_code) ? current.weather_code : 0,
              isDay: Number.isFinite(current.is_day) ? current.is_day : null,
              temperature: Number.isFinite(current.temperature_2m) ? current.temperature_2m : null
            }));
          } catch (e) {
            if (e.name !== 'AbortError') {
              console.error(e);
              setWeather(prev => ({
                ...prev,
                ...getWeatherState({
                  date: new Date(),
                  weatherCode: prev.weatherCode || 0,
                  isDay: typeof prev.isDay === 'number' ? prev.isDay : null,
                  temperature: prev.temperature ?? null
                })
              }));
            }
          }
        };

        loadWeather();
        const weatherTimer = setInterval(loadWeather, 10 * 60 * 1000);

        return () => {
          controller.abort();
          clearInterval(weatherTimer);
        };
      }, []);

      useEffect(() => {
        const requestId = requestSeq.current + 1;
        requestSeq.current = requestId;
        const controller = new AbortController();

        if (activeCat.id === 'ABOUT') {
          setHeadline(null);
          setNews([]);
          setLoading(false);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return () => controller.abort();
        }

        if (activeCat.id === 'BY_HERALD') {
          const articles = getStoredByHeraldArticles();
          setByHeraldArticles(articles);
          setHeadline(null);
          setNews([]);
          setLoading(false);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return () => controller.abort();
        }

        setLoading(true);
        const load = async () => {
          try {
            let results = [];
            const getQueries = (cat) => cat.queries || (cat.query ? [cat.query] : []);
            const interleave = (groups) => {
              const mixed = [];
              const maxLength = Math.max(0, ...groups.map(group => group.length));

              for (let i = 0; i < maxLength; i++) {
                groups.forEach(group => {
                  if (group[i]) mixed.push(group[i]);
                });
              }

              return mixed;
            };
            const dedupeItems = (items) => {
              const seen = new Set();
              return items.filter(item => {
                const key = item.id || item.url || item.title;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
              });
            };
            const latestItemTime = (items) => {
              const time = items[0]?.pubDate ? new Date(items[0].pubDate).getTime() : 0;
              return Number.isFinite(time) ? time : 0;
            };
            const buildItem = (item, cat) => {
              const parts = (item.title || '').split(' - ');
              const publishedAt = item.pubDate ? new Date(item.pubDate) : new Date();
              const title = parts[0]?.trim() || 'Sin título';
              const cleanDescription = getBestSummaryText(item, title);
              const excerpt = buildExcerpt(cleanDescription, title);
              return {
                id: item.guid || item.link,
                title,
                source: parts[parts.length - 1]?.trim() || 'Desconocido',
                excerpt,
                quickRead: cleanDescription && normalizeText(cleanDescription) !== normalizeText(title)
                  ? cleanDescription
                  : 'Sin resumen disponible para esta fuente.',
                url: item.link,
                color: cat.color,
                category: cat.name,
                pubDate: item.pubDate,
                timeAgo: (() => {
                  const d = Date.now() - publishedAt.getTime();
                  if (!Number.isFinite(d)) return 'Ahora';
                  const m = Math.max(0, Math.floor(d / 60000));
                  if (m < 60) return `${m}m`;
                  const h = Math.floor(m / 60);
                  if (h < 24) return `${h}h`;
                  return `${Math.floor(h / 24)}d`;
                })()
              };
            };
            const fetchCategory = async (cat) => {
              const queryResults = await Promise.all(getQueries(cat).map(async (query) => {
                try {
                  const res = await fetchWithTimeout(`${RSS_TO_JSON_API}${encodeURIComponent(query)}`, { signal: controller.signal });
                  if (!res.ok) throw new Error(`rss status ${res.status}`);
                  const data = await res.json();
                  return Array.isArray(data.items)
                    ? data.items.map(item => buildItem(item, cat))
                    : [];
                } catch (e) {
                  if (e.name === 'AbortError') throw e;
                  console.error(e);
                  return [];
                }
              }));

              return dedupeItems(interleave(queryResults));
            };

            if (activeCat.id === 'ALL') {
              const sourceCategories = CATEGORIES.filter(cat => cat.id !== 'ALL');
              const categoryResults = await Promise.all(sourceCategories.map(fetchCategory));
              const latestFirst = [...categoryResults].sort((a, b) => latestItemTime(b) - latestItemTime(a));
              results = dedupeItems(interleave(latestFirst));
            } else {
              results = await fetchCategory(activeCat);
            }

            if (requestSeq.current !== requestId) return;

            setHeadline(results[0]);
            setNews(results.slice(1, 16));
          } catch(e) {
            if (e.name !== 'AbortError') {
              console.error(e);
              if (requestSeq.current === requestId) {
                setHeadline(null);
                setNews([]);
              }
            }
          } finally {
            if (requestSeq.current === requestId) {
              setLoading(false);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          }
        };
        load();

        return () => controller.abort();
      }, [activeCat]);

      useEffect(() => {
        setSelectedArticle(null);
      }, [activeCat]);

      return (
        <div className="min-h-screen bg-white text-black selection:bg-black selection:text-white">
          <Header activeId={activeCat.id} onSelect={setActiveCat} timeLabel={timeLabel} />
          
          <main>
            <AnimatePresence mode="wait">
              {loading ? (
                <LoadingScreen key="loader" />
              ) : activeCat.id === 'ABOUT' ? (
                <AboutView />
              ) : activeCat.id === 'BY_HERALD' ? (
                <ByHeraldView articles={byHeraldArticles} onSelectArticle={setSelectedArticle} />
              ) : (
                <motion.div key={activeCat.id} initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                  
                  {headline ? (
                    <section className="sticky top-0 h-screen z-0 flex flex-col justify-end px-6 md:px-16 pb-28 overflow-hidden text-white">
                      <Atmosphere weather={weather} />
                      
                      <div className="headline-content relative z-30 max-w-3xl">
                        <motion.div initial={{ y: 40, opacity: 0 }} animate={{ y: 0, opacity: 1 }} transition={{ duration: 0.8, ease: "easeOut" }}>
                          <div className="flex items-center gap-4 mb-10">
                            <div className="px-2.5 py-0.5 border border-white/20 text-[8px] font-black uppercase bg-white/5">Señal {activeCat.id}</div>
                            <div className="w-2 h-2 rounded-full shadow-[0_0_8px_rgba(255,255,255,0.4)] animate-pulse" style={{backgroundColor: headline.color}} />
                            <span className="text-[10px] font-black uppercase text-white/60">{headline.category}</span>
                            <span className="hidden sm:inline-flex text-[8px] font-black uppercase text-white/35 tracking-[0.18em]">
                              {PERIOD_LABELS[weather.period]} / {WEATHER_LABELS[weather.condition]}{typeof weather.temperature === 'number' ? ` / ${Math.round(weather.temperature)}°C` : ''}
                            </span>
                          </div>
                          
                          <h2 className="herald-font-black text-3xl md:text-3xl lg:text-4xl uppercase herald-leading-tightest mb-10">
                            {headline.title}
                          </h2>
                          
                          <div className="flex items-center gap-8">
                            <div className="flex flex-col">
                              <span className="text-[8px] font-black uppercase text-white/30 mb-1">Origen</span>
                              <span className="text-[10px] font-bold uppercase text-white/80">{headline.source}</span>
                            </div>
                            <div className="flex flex-col">
                              <span className="text-[8px] font-black uppercase text-white/30 mb-1">Sincronización</span>
                              <span className="text-[10px] font-bold uppercase text-white/80">Hace {headline.timeAgo}</span>
                            </div>
                            <a href={headline.url} target="_blank" className="ml-4 p-3 rounded-full border border-white/10 hover:bg-white hover:text-black transition-all">
                              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
                            </a>
                          </div>
                        </motion.div>
                      </div>

                      <div className="absolute right-8 bottom-20 hidden md:block opacity-30">
                        <div className="text-[8px] font-black uppercase origin-right rotate-90 whitespace-nowrap translate-y-full">
                          {activeCat.id} // TRANSMISSION ACTIVE
                        </div>
                      </div>
                    </section>
                  ) : (
                    <EmptyNewsState activeCat={activeCat} />
                  )}

                  {news.length > 0 && (
                    <section className="news-transition px-6 md:px-16 pt-24 pb-20">
                      <div className="max-w-[1400px] mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-12 gap-y-16">
                        {news.map((item, i) => (
                          <motion.article 
                            key={item.id + i} 
                            initial={{ opacity: 0, y: 20 }} 
                            whileInView={{ opacity: 1, y: 0 }}
                            viewport={{ once: true, margin: "-50px" }}
                            transition={{ delay: (i % 3) * 0.1 }}
                            className="group cursor-pointer border-t border-black/10 pt-10"
                            onClick={() => setSelectedArticle(item)}
                          >
                            <div className="flex items-center justify-between mb-5">
                              <span className="text-[9px] font-black uppercase px-2 py-0.5 rounded-sm bg-black/5" style={{color: item.color}}>{item.category}</span>
                              <span className="text-[9px] font-bold text-black/20 uppercase">{item.timeAgo}</span>
                            </div>
                            
                            <h3 className="text-xl font-black uppercase leading-[1.28] tracking-[-0.01em] mb-4 group-hover:text-black/70 transition-colors">
                              {item.title}
                            </h3>
                            
                            {item.excerpt && (
                              <p className="text-[12px] leading-[1.75] text-neutral-600 font-medium italic line-clamp-3 opacity-70 group-hover:opacity-100 transition-opacity">
                                {item.excerpt}
                              </p>
                            )}
                            
                            <div className="mt-7 text-[9px] font-black uppercase tracking-[0.14em] text-black/20 group-hover:text-black transition-colors">
                              Quick Read →
                            </div>
                          </motion.article>
                        ))}
                      </div>
                    </section>
                  )}

                  <AnimatePresence>
                    {selectedArticle && (
                      <motion.div
                        initial={{ opacity: 0 }}
                        animate={{ opacity: 1 }}
                        exit={{ opacity: 0 }}
                        className="fixed inset-0 z-[220] bg-black/35 backdrop-blur-sm p-6 md:p-10 flex items-end md:items-center justify-center"
                        onClick={() => setSelectedArticle(null)}
                      >
                        <motion.div
                          initial={{ y: 32, opacity: 0 }}
                          animate={{ y: 0, opacity: 1 }}
                          exit={{ y: 24, opacity: 0 }}
                          transition={{ duration: 0.22, ease: 'easeOut' }}
                          className="w-full max-w-3xl bg-white text-black rounded-[32px] border border-black/10 shadow-[0_24px_80px_rgba(0,0,0,0.18)] p-6 md:p-8"
                          onClick={(e) => e.stopPropagation()}
                        >
                          <div className="flex items-start justify-between gap-6 mb-8">
                            <div>
                              <div className="flex items-center gap-3 mb-4">
                                <span className="text-[9px] font-black uppercase px-2 py-0.5 rounded-sm bg-black/5" style={{ color: selectedArticle.color }}>
                                  {selectedArticle.category}
                                </span>
                                <span className="text-[9px] font-bold uppercase text-black/30">{selectedArticle.timeAgo}</span>
                              </div>
                              <h3 className="text-2xl md:text-3xl font-black uppercase leading-[1.16] tracking-[-0.01em]">
                                {selectedArticle.title}
                              </h3>
                            </div>
                            <button
                              onClick={() => setSelectedArticle(null)}
                              className="w-11 h-11 rounded-full border border-black/10 text-xl flex items-center justify-center hover:bg-black hover:text-white transition-colors"
                            >
                              &times;
                            </button>
                          </div>

                          <p className="text-[13px] md:text-[14px] leading-[1.9] text-neutral-700 mb-8 max-w-[62ch]">
                            {selectedArticle.quickRead}
                          </p>

                          <div className="flex items-center justify-between gap-4 pt-6 border-t border-black/10">
                            <div className="text-[10px] font-black uppercase text-black/35">
                              {selectedArticle.source}
                            </div>
                            <a
                              href={selectedArticle.url}
                              target="_blank"
                              rel="noreferrer"
                              className={`px-4 py-2 rounded-full bg-black text-white text-[10px] font-black uppercase hover:opacity-80 transition-opacity ${selectedArticle.url ? '' : 'pointer-events-none opacity-30'}`}
                            >
                              {selectedArticle.url ? 'Abrir Nota' : 'Nota Interna'}
                            </a>
                          </div>
                        </motion.div>
                      </motion.div>
                    )}
                  </AnimatePresence>
                </motion.div>
              )}
            </AnimatePresence>

            <AnimatePresence>
              {selectedArticle && activeCat.id === 'BY_HERALD' && (
                <motion.div
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  exit={{ opacity: 0 }}
                  className="fixed inset-0 z-[220] bg-black/35 backdrop-blur-sm p-6 md:p-10 flex items-end md:items-center justify-center"
                  onClick={() => setSelectedArticle(null)}
                >
                  <motion.div
                    initial={{ y: 32, opacity: 0 }}
                    animate={{ y: 0, opacity: 1 }}
                    exit={{ y: 24, opacity: 0 }}
                    transition={{ duration: 0.22, ease: 'easeOut' }}
                    className="w-full max-w-3xl bg-white text-black rounded-[32px] border border-black/10 shadow-[0_24px_80px_rgba(0,0,0,0.18)] p-6 md:p-8"
                    onClick={(e) => e.stopPropagation()}
                  >
                    <div className="flex items-start justify-between gap-6 mb-8">
                      <div>
                        <div className="flex items-center gap-3 mb-4">
                          <span className="text-[9px] font-black uppercase px-2 py-0.5 rounded-sm bg-black text-white">
                            {selectedArticle.category}
                          </span>
                          <span className="text-[9px] font-bold uppercase text-black/30">{selectedArticle.timeAgo}</span>
                        </div>
                        <h3 className="text-2xl md:text-3xl font-black uppercase leading-[1.16] tracking-[-0.01em]">
                          {selectedArticle.title}
                        </h3>
                      </div>
                      <button
                        onClick={() => setSelectedArticle(null)}
                        className="w-11 h-11 rounded-full border border-black/10 text-xl flex items-center justify-center hover:bg-black hover:text-white transition-colors"
                      >
                        &times;
                      </button>
                    </div>

                    <p className="text-[13px] md:text-[14px] leading-[1.9] text-neutral-700 mb-8 max-w-[62ch] whitespace-pre-line">
                      {selectedArticle.quickRead}
                    </p>

                    <div className="flex items-center justify-between gap-4 pt-6 border-t border-black/10">
                      <div className="text-[10px] font-black uppercase text-black/35">
                        {selectedArticle.source}
                      </div>
                      {selectedArticle.url && (
                        <a
                          href={selectedArticle.url}
                          target="_blank"
                          rel="noreferrer"
                          className="px-4 py-2 rounded-full bg-black text-white text-[10px] font-black uppercase hover:opacity-80 transition-opacity"
                        >
                          Abrir Link
                        </a>
                      )}
                    </div>
                  </motion.div>
                </motion.div>
              )}
            </AnimatePresence>
          </main>

          <footer className="px-6 md:px-16 py-24 border-t border-black/5 bg-white flex flex-col md:flex-row justify-between items-center gap-10 opacity-30 hover:opacity-100 transition-opacity duration-700">
            <div className="flex flex-col items-center md:items-start gap-4">
              <HeraldLogo className="w-10 h-10 grayscale" />
              <span className="text-[8px] font-black uppercase">Developed by CRUSADE</span>
            </div>
            <div className="flex gap-8 text-[9px] font-black uppercase text-black/50">
              <button onClick={() => setActiveCat(CATEGORIES.find(cat => cat.id === 'ABOUT'))} className="hover:text-black">About</button>
              <button onClick={() => setActiveCat(CATEGORIES[0])} className="hover:text-black">Home</button>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
